name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    if: ${{ !startsWith(github.head_ref, 'release-') }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/home_widget
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: bluefireteam/melos-action@v3
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install ktfmt
        env:
          KTFMT_VERSION: '0.64'
          KTFMT_SHA256: 5b3d5286fd2defcc7dc8e28c21ddf156cc6b2d8682bdcd929ce4333e7a6201f2
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/ktfmt.jar" \
            "https://repo1.maven.org/maven2/com/facebook/ktfmt/$KTFMT_VERSION/ktfmt-$KTFMT_VERSION-with-dependencies.jar"
          echo "$KTFMT_SHA256  $RUNNER_TEMP/ktfmt.jar" | shasum -a 256 -c -
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/ktfmt.jar" > "$RUNNER_TEMP/bin/ktfmt"
          chmod +x "$RUNNER_TEMP/bin/ktfmt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Analyze
        run: melos analyze
      - name: Format
        run: melos format:all
      - name: Publishability
        run: flutter pub publish --dry-run

