name: Build macOS Examples

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'packages/home_widget/lib/**'
      - 'packages/home_widget/darwin/**'
      - 'packages/home_widget/pubspec.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'examples/**'
      - 'packages/home_widget/example/**'
      - '.github/workflows/build-macos-examples.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-examples:
    name: Discover macOS Examples
    if: ${{ !startsWith(github.head_ref, 'release-') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: bluefireteam/melos-action@v3
      - name: Discover macOS examples
        id: set-matrix
        run: |
          examples=$(melos list --dir-exists="macos" --ignore="home_widget" --json | jq -r '.[].name' | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "matrix={\"example\":$examples}" >> "$GITHUB_OUTPUT"

  build-examples:
    name: Build macOS Examples
    needs: discover-examples
    runs-on: macos-15
    strategy:
      matrix: ${{ fromJson(needs.discover-examples.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: bluefireteam/melos-action@v3
      - name: Build macOS Example
        env:
          MELOS_PACKAGES: ${{ matrix.example }}
        run: melos run build:macos:examples --no-select
