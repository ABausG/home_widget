name: generator_basics
description: "A minimal example showcasing the home_widget_generator and home_widget_cli packages."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.1.6
  font_awesome_flutter: ^10.12.0
  home_widget:
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  home_widget_cli:
  home_widget_generator:

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/dash.png
  fonts:
    - family: Chewy
      fonts:
        - asset: assets/fonts/Chewy-Regular.ttf
