name: streak_widget
description: "Dasholingo - a Duolingo-style streak widget built with home_widget_generator."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  home_widget:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  home_widget_cli:
  home_widget_generator:

flutter:
  uses-material-design: true
  assets:
    - assets/dash/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
